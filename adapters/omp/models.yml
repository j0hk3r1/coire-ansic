# omp custom provider config — points at coire-bifrost via strip-shim.
# Pool aliases (best/code/mid/fast/compress/vision/ops) appear as selectable models.

providers:
  coire-bifrost:
    baseUrl: http://localhost:4002/v1
    auth: none
    api: openai-completions
    models:
      - id: best
        name: best — frontier user-facing chat
        input: [text]
        contextWindow: 131072
        maxTokens: 16384
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      - id: code
        name: code — code generation + review
        input: [text]
        contextWindow: 131072
        maxTokens: 16384
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      - id: mid
        name: mid — balanced dialog + tools
        input: [text]
        contextWindow: 131072
        maxTokens: 8192
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      - id: fast
        name: fast — low-latency Q/A
        input: [text]
        contextWindow: 131072
        maxTokens: 4096
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      - id: compress
        name: compress — long-input summarization
        input: [text]
        contextWindow: 131072
        maxTokens: 8192
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      - id: vision
        name: vision — image inputs
        input: [text, image]
        contextWindow: 131072
        maxTokens: 4096
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      - id: ops
        name: ops — operator agents (small/fast)
        input: [text]
        contextWindow: 131072
        maxTokens: 4096
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
