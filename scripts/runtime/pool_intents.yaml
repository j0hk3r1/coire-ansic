# Pool intent specs — what each pool is FOR, in terms of capability requirements.
# Read by build_pool_targets.py alongside model_capabilities.yaml to auto-assemble
# pool_weights.yaml without hand-tuning.
#
# Field reference:
#   needs:    all conditions must match. Numeric fields: model_value >= needs_value.
#             Categorical fields (tools, free_tier, latency_tier): can be a single
#             value OR a list (OR match). vision: bool exact match.
#   exclude:  any matching condition disqualifies. Numeric *_below excludes when
#             model_value < threshold AND model_value is not null (null = unbounded).
#   prefer:   ordering keys. Each key contributes to ranking score; bonus_when
#             gives explicit +N for boolean/categorical matches.
#   max_per_provider, min_primaries, max_primaries — pool shape constraints.
#
# Capability fields: ctx_input, ctx_output, rpm_cap, tpm_cap, rpd_cap,
#   tools (none|simple|full), vision (bool), reasoning (bool), latency_tier
#   (inst|fast|mid|slow), code_specialty (bool), quality_score (0-100),
#   free_tier (ok|needs_balance|free_zero|unstable).

pools:

  best:
    description: Frontier-tier quality, long-context user-facing chat
    needs:
      ctx_input: 64000
      tools: full
      free_tier: ok
    exclude:
      tpm_cap_below: 8000
      latency_tier_in: [slow]
    prefer:
      quality_score: high
      ctx_input: high
    max_per_provider: 0.40
    min_primaries: 4
    max_primaries: 8

  code:
    description: Code generation + review, long-context multi-file
    needs:
      ctx_input: 32000
      tools: full
      free_tier: ok
    exclude:
      tpm_cap_below: 8000
      latency_tier_in: [slow]
    prefer:
      quality_score: high
      bonus_when:
        code_specialty: 10        # codestral / qwen-coder get +10 ranking
        reasoning: 3              # reasoning models (gpt-oss/qwen3) get small boost for code
    max_per_provider: 0.40
    min_primaries: 4
    max_primaries: 8

  mid:
    description: Mid-tier dialog + tool use, general agentic workloads — balanced
    needs:
      ctx_input: 16000
      tools: full
      free_tier: ok
      latency_tier: [inst, fast, mid]   # exclude slow models from mid
    exclude:
      tpm_cap_below: 8000
    prefer:
      quality_score: high
      bonus_when:
        latency_tier_inst: 5
        latency_tier_fast: 3
    max_per_provider: 0.40
    min_primaries: 4
    max_primaries: 8

  fast:
    description: Low-latency Q/A, short prompts, simple tools acceptable
    needs:
      ctx_input: 4000
      latency_tier: [inst, fast]        # the defining constraint
      free_tier: ok
    prefer:
      bonus_when:
        latency_tier_inst: 15           # inst >> fast for this pool
        latency_tier_fast: 3
      quality_score: high               # secondary
    max_per_provider: 0.40
    min_primaries: 4
    max_primaries: 8

  compress:
    description: Long-input summarization, no tools required, latency tolerant
    needs:
      ctx_input: 64000
      free_tier: ok
    exclude:
      latency_tier_in: [slow]
    prefer:
      quality_score: high
      ctx_input: high
    max_per_provider: 0.40
    min_primaries: 3
    max_primaries: 6

  vision:
    description: Image-input tasks
    needs:
      vision: true
      free_tier: ok
    exclude:
      latency_tier_in: [slow]
    prefer:
      quality_score: high
    max_per_provider: 0.40
    min_primaries: 3
    max_primaries: 6

  ops:
    description: Operator agents (pi-op-*) — isolated, tool-heavy, low quality OK
    needs:
      ctx_input: 8000
      tools: [simple, full]             # ops tolerates tools=simple (cerebras llama3.1-8b)
      free_tier: ok
    exclude:
      tpm_cap_below: 8000               # still exclude groq if it would 413
      latency_tier_in: [slow]
    prefer:
      rpd_cap: high                     # operator loops are RPD-hungry
      bonus_when:
        latency_tier_inst: 8            # inst is gold for ops fan-out
    max_per_provider: 0.50              # ops can lean harder on a single provider
    min_primaries: 3
    max_primaries: 6

fallback_policy:
  cold_start_last: true
  needs_balance_last: true
  max_fallbacks_per_pool: 12
