# Per-model capability tags — feeds build_pool_targets.py.
# Edit ONE yaml entry to update a model's properties, never hand-tune pool_weights.yaml.
#
# Field semantics:
#   ctx_input:       max input tokens accepted on free tier (probe-verified
#                    where possible; "ctx_cap_<N>" from free_tier_probe.json)
#   ctx_output:      max output tokens (model docs)
#   rpm_cap:         requests per minute (header-verified — see notes)
#   tpm_cap:         tokens per minute (header-verified)
#   rpd_cap:         requests per day
#   tools:           none | simple | full
#                    - none: model can't call tools at all (or buggy enough to skip)
#                    - simple: single-tool OK, parallel tool calls flaky
#                    - full: parallel tool calls + tool_choice work reliably
#   vision:          true if model accepts image inputs
#   reasoning:       true if model has structured thinking (deepseek/gpt-oss/qwen3 with think mode, etc.)
#   quality_score:   normalized 0-100 quality estimate (higher = smarter)
#                    Source priority: artificialanalysis.ai > LMArena > estimate
#                    AA Intelligence Index v4.0 (May 2026): GPT-5.5=60 top, scaled here
#                    such that aa_score directly = quality_score (since AA caps at ~60-65).
#   quality_source:  "AA" | "LMArena" | "estimate"
#   free_tier:       ok | needs_balance | free_zero | unstable
#   notes:           any relevant remarks (cold-start, context cap, etc.)
#
# Verified 2026-05-19 against:
#   - free_tier_probe.json on .93 (ctx caps + free_tier classification)
#   - artificialanalysis.ai/leaderboards/models (quality_score)
#   - provider response headers captured in pool_weights.yaml notes
#   - bifrost log p50/p95 latencies observed over the last 24h
#
# Estimates marked quality_source=estimate are author judgments. Replace as
# more public benchmarks publish numbers for these models.

