# Pool weight plan — applied 2026-05-22 (omo-main merge)
#
# Merges omo-kimi + omo-gpt-5-5 → omo-main (default-variant, family-agnostic).
# Goals:
#  1. End the gpt-5-5 pool dead-weight (3 calls/4.8h session = 4% utilization)
#  2. Drop the 66s nvidia/glm-5.1 LLM bottleneck from primary cascade
#  3. Add 4 untapped providers: mistral, sambanova, gemini-3-flash, OR qwen3-next
#  4. Dedupe within pool — every fallback is a distinct provider quota pool
#  5. Drop gpt-oss-120b entirely (~1353 arena + 12k TPM ceiling = useless slot)
#  6. Slow/problematic kept at fb=10 as last-resort cushion
#
# Verified live 2026-05-22 ~10:11 UTC:
#   - Cerebras zai-glm-4.7: 200 OK, alive (5 RPM, 2400 RPD)
#   - Gemini-3-flash-preview: 200 OK, alive (250 RPD/model)
#   - Sambanova DeepSeek-V3.2: TOOLCALL ok, 2.0s, 20 RPD/model
#   - Sambanova DeepSeek-V3.1: TEXT-ONLY (broken tools) — EXCLUDED
#   - Mistral large-2512: TOOLCALL ok, 0.6s, 4 RPM tight
#   - Mistral medium-3.5: TOOLCALL ok, 0.33s, 50 RPM (huge headroom)
#   - Groq llama-3.3-70b: TOOLCALL ok, 0.24s, BUT 12k TPM — DROPPED (too small for omo)
#   - NVIDIA nemotron-49b: TEXT-ONLY (broken tools) — EXCLUDED
#
# LMArena Elo (verified arena.ai/leaderboard/text May 2026):
#   gemini-3.1-pro-preview: 1488 | gemini-3.5-flash: 1480 | gemini-3-flash-preview: 1473
#   glm-5.1: 1472 | kimi-k2.6: 1462 | deepseek-v4-pro: 1459 | kimi-k2.5-thinking: 1449
#   qwen3.6-plus: 1444 | glm-4.7: 1443 | deepseek-v4-flash: 1433 | deepseek-v3.2: 1424
#   mistral-large-3 (=2512): 1415 | qwen3-next-80b-instruct: 1402 | gpt-oss-120b: 1353

pools:
  omo-main:
    # FAMILY-AGNOSTIC pool — name does NOT contain kimi/gpt-5-5/gemini, so
    # omo loads buildDynamicSisyphusPrompt (default variant) which adapts
    # to whichever model bifrost serves (auto-injects gemini overrides when gemini fires).
    targets:
    - provider: cerebras
      model: zai-glm-4.7
      weight: 1.0
    fallbacks:
    # 2026-05-22 13:55 UTC: scores now reference MULTI-TURN arena (more
    # relevant for omo's orchestration workload). Added qwen-3-235b (cerebras)
    # at fb=4 — shim param-rejection retry verified working, 1437 MT.
    # Removed nvidia/deepseek-v4-pro (cold today). qwen3-next-80b kept at fb=10
    # as fast-fail cushion before slow nvidia/glm-5.1 last-resort.
    #
    # MT-Elo (lmarena.ai/leaderboard/text/multi-turn):
    #   gemini-3.5-flash 1487 | gemini-3-flash 1484 | glm-5.1 1478 | deepseek-v4-pro 1473
    #   kimi-k2.6 1467 | glm-4.7 1460 | deepseek-v4-flash 1450 | qwen-3-235b 1437
    #   mistral-large-3 (=2512) 1421 | mistral-medium-2508 (=3.5) 1412 | qwen3-next-80b 1404
    #
    # TIER A — most reliable in cascade today
    - mistral/mistral-large-2512                          # 1421 MT, 0.6s, 4 RPM, 76% serve test-14
    - cloudflare/@cf/moonshotai/kimi-k2.6                 # 1467 MT, ~3s, 29% serve test-14
    # TIER B — works but RPM/quota-limited
    - gemini/gemini-3.5-flash                             # 1487 MT, 0.94s probe, separate 20 RPM
    - cerebras/qwen-3-235b-a22b-instruct-2507             # 1437 MT (shim strips reasoning_effort)
    - zai/glm-4.7-flash                                   # ~1430 est MT, NEW native Z.ai (own quota)
    - gemini/gemini-3-flash-preview                       # 1484 MT, 20 RPM cap
    - openrouter/deepseek/deepseek-v4-flash:free          # 1450 MT, 3s probe
    - mistral/mistral-medium-3.5                          # 1412 MT, 0.33s, 50 RPM, 54% serve test-14
    # TIER C — frequent errors but high IQ (fast-fail = good for cascade walk)
    - openrouter/z-ai/glm-5.1                             # 1478 MT, OR (402 credits sometimes)
    - nvidia-nim/moonshotai/kimi-k2.6                     # 1467 MT, NIM (unhashable bug + 429)
    - openrouter/qwen/qwen3-next-80b-a3b-instruct:free    # 1404 MT, Venice fast 429 cushion
    # TIER D — slow last-resort
    - nvidia-nim/z-ai/glm-5.1                             # 1478 MT, SLOW 66s — LAST RESORT

  omo-gemini:
    # Unchanged — visual/artistry agents (multimodal-looker)
    targets:
    - provider: gemini
      model: gemini-3-flash-preview
      weight: 1.0
    fallbacks:
    # 2026-05-22 12:08 UTC: REMOVED gemini-3.1-pro-preview — paid-only on free
    # tier (probe: "free_tier_requests limit: 0"). Wasted cascade slot.
    - gemini/gemini-3.5-flash
    - gemini/gemini-3.1-flash-lite-preview
    - gemini/gemini-2.5-flash
    - mistral/pixtral-large-latest
    - nvidia-nim/meta/llama-3.2-90b-vision-instruct

  omo-utility:
    # Unchanged — librarian/explore small queries
    targets:
    - provider: gemini
      model: gemini-3.1-flash-lite-preview
      weight: 1.0
    fallbacks:
    - gemini/gemini-flash-latest
    - gemini/gemini-2.5-flash
    - gemini/gemini-3.5-flash
    - gemini/gemini-2.5-flash-lite
    - gemini/gemini-flash-lite-latest
    - nvidia-nim/google/gemma-4-31b-it
