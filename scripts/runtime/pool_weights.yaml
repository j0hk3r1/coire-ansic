  compress:
    # Compress = long-context summarization (8-30k token prompts typical).
    # 2026-05-19: groq/llama-3.3-70b-versatile moved primary→fallback —
    # groq free-tier has 6k TPM-per-call across all models, so 413s
    # ('request too large') were ~10% of compress traffic. github-models
    # gpt-4.1 (2M TPM, 128k context, 20k RPM) replaces it as primary.
    # Earlier note: nvidia-nim/meta/llama-3.3-70b-instruct stays in
    # fallback only — 400 'single tool-calls at once' rejects parallel
    # tool_calls from hermes/pi-op.
