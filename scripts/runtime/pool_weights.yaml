  ops:
    # Operator-agent (pi-op-react / pi-op-health) traffic ONLY. Designed to
    # absorb pi-mono's ~30 internal-tool-call bursts per run WITHOUT eating
    # the user-facing pools' (best/code/mid/fast) provider budgets.
    #
    # Pi-op prompts often run 8-15k tokens (full bifrost log dumps + tool
    # definitions + skill content) AND send parallel tool_calls. Two hard
    # constraints rule out most providers:
    #  - groq free-tier 8b models 413 on >6k token requests (TPM bucket)
    #  - nvidia-nim/meta/llama-3.3-70b-instruct rejects parallel tool_calls
    #    with HTTP 400 ("single tool-calls at once")
    # All cerebras models tolerate parallel tools + 60k TPM headroom. Use
    # cerebras-only primaries; groq + mistral + nvidia kept as fallback
    # for the rare single-tool-call requests.
    # No cf-openai (neuron-budget shared globally), no gemini (250 RPD shared
    # globally), no openrouter (50 RPD pool budget shared globally), no
    # github-models (hermes uses gpt-4.1-mini in mid pool).
    # 2026-05-19: spread across 3 providers (cerebras, github-models, nvidia-nim)
    # to escape cerebras 30 RPM cap saturation. All 5 primaries support parallel
    # tool_calls and have ≥30k context.
    targets:
    - provider: cerebras
      model: qwen-3-235b-a22b-instruct-2507
      weight: 0.30
    - provider: github-models
      model: openai/gpt-4.1-mini
      weight: 0.20
    - provider: nvidia-nim
      model: moonshotai/kimi-k2.6
      weight: 0.20
