# CoireAnsic — free-tier LLM router
#
# CORE (default `docker compose up -d`):
#   strip-shim :4001 — the PUBLIC front door. Normalizes every /v1 request
#                      (Mistral tool-id, Kimi/Qwen tokens, param-rejection +
#                      reasoning-only retries) and transparently passes /anthropic
#                      and /api through. Clients point here: http://<host>:4001/v1.
#   bifrost  (:4011) — the gateway behind the shim. Driven entirely by
#                      bifrost/data/config.json (rendered from the git-tracked
#                      bifrost/config.json by install.sh). Providers + keys (.env)
#                      + pools declared there. Only published on 127.0.0.1:4011 for
#                      admin/smoke-tests; the shim reaches it over the internal net.
#
# OPTIONAL (opt-in profiles — NOT started by the core):
#   searxng    :8891  profile "searxng"   — self-hosted meta-search
#   camofox    :9378  profile "camofox"   — anti-detect Firefox (BYO source)
#
#   e.g.  docker compose --profile searxng up -d

services:
  bifrost:
    image: maximhq/bifrost
    container_name: coire-bifrost
    ports:
      # Admin/debug only, loopback. The PUBLIC :4001 front door is now strip-shim
      # (always-on, normalizes every request before it reaches bifrost). Bifrost
      # itself is reachable by the shim over the internal docker net (bifrost:8080);
      # this mapping is just for install.sh smoke-tests and direct debugging.
      # BIFROST_PASS guards the admin API.
      - "127.0.0.1:4011:8080"
    volumes:
      - ./bifrost/data:/app/data          # app-dir: holds the rendered config.json + DB
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/providers > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Optional Layer-2 services (opt-in via --profile) ──────────────────────

  # OpenAI-compat normalizer — now the ALWAYS-ON public front door on :4001.
  # Every request flows client → shim :4001 → bifrost:8080. It normalizes the
  # known quirks (Mistral 9-char tool-id, Kimi/Qwen tool-call formats,
  # reasoning-only retries, param-rejection) on /v1, and transparently passes
  # /anthropic + /api straight through to bifrost. Core service (no profile).
  strip-shim:
    build:
      context: ./strip-shim
    image: coire-strip-shim:latest
    container_name: coire-strip-shim
    ports:
      - "0.0.0.0:4001:4002"   # PUBLIC front door (was bifrost). host :4001 → shim :4002
    environment:
      BIFROST_URL: http://bifrost:8080
      MODELS_JSON_PATH: /root/.coire/models.json
    volumes:
      - ~/.coire:/root/.coire:ro
    depends_on:
      bifrost:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # python:3.13-slim has no curl/wget — use urllib. /health pings bifrost too.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4002/health',timeout=3).status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  searxng:
    profiles: ["searxng"]
    image: searxng/searxng:latest
    container_name: coire-searxng
    ports:
      - "127.0.0.1:8891:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:8891/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-change-me-in-env-file}"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Anti-detect Firefox (MIT, REST API on :9377 wrapping Camoufox). Opt-in via
  # --with-camofox AFTER cloning redf0x1/camofox-browser into ./camofox/src (see camofox/README.md).
  camofox:
    profiles: ["camofox"]
    build:
      context: ./camofox/src
    image: coire-camofox:latest
    container_name: coire-camofox
    ports:
      - "0.0.0.0:9378:9377"   # host :9378 → container :9377 (REST API)
      - "127.0.0.1:6080:6080" # noVNC viewer (loopback only)
    environment:
      CAMOFOX_HOST: 0.0.0.0
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-}
      CAMOFOX_AUTH_MODE: ${CAMOFOX_AUTH_MODE:-auto}
    volumes:
      - ./camofox/data:/home/node/.camofox
    restart: unless-stopped
    shm_size: 2gb
    mem_limit: 6g           # leaked tabs OOM the container, not the host (8GB .93 wedged 2026-06-09)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9377/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
