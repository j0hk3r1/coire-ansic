# CoireAnsic — free-tier LLM router
#
# CORE (default `docker compose up -d`):
#   bifrost :4001  — the gateway. Driven entirely by bifrost/data/config.json
#                    (rendered from the git-tracked bifrost/config.json by install.sh).
#                    Providers + keys (via .env) + pools all declared there.
#
# OPTIONAL (opt-in profiles — NOT started by the core):
#   strip-shim :4002  profile "shim"      — OpenAI-compat normalizer (Mistral tool-id,
#                                            Kimi/Qwen tokens, param-rejection retries)
#   dashboard  :9118  profile "dashboard" — pool/latency monitor
#   searxng    :8891  profile "searxng"   — self-hosted meta-search
#   camofox    :9378  profile "camofox"   — anti-detect Firefox (BYO source)
#
#   e.g.  docker compose --profile shim --profile dashboard up -d

services:
  bifrost:
    image: maximhq/bifrost
    container_name: coire-bifrost
    ports:
      - "0.0.0.0:4001:8080"  # LAN-accessible. Inference is unauthenticated by default
                             # (trusted-LAN deploy). BIFROST_PASS guards the admin API.
    volumes:
      - ./bifrost/data:/app/data          # app-dir: holds the rendered config.json + DB
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/providers > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Optional Layer-2 services (opt-in via --profile) ──────────────────────

  # OpenAI-compat normalizer. Only needed for clients/providers that hit the
  # known quirks (Mistral 9-char tool-id, Kimi/Qwen tool-call formats,
  # reasoning-only retries, param-rejection). zai no longer needs it — config.json
  # points zai direct at its native endpoint.
  strip-shim:
    profiles: ["shim"]
    build:
      context: ./strip-shim
    image: coire-strip-shim:latest
    container_name: coire-strip-shim
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      BIFROST_URL: http://bifrost:8080
      MODELS_JSON_PATH: /root/.coire/models.json
      ZAI_API_KEY: "${ZAI_API_KEY:-}"   # legacy zai-proxy path (unused now zai is direct)
    volumes:
      - ~/.coire:/root/.coire:ro
    depends_on:
      bifrost:
        condition: service_started
    restart: unless-stopped

  searxng:
    profiles: ["searxng"]
    image: searxng/searxng:latest
    container_name: coire-searxng
    ports:
      - "127.0.0.1:8891:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:8891/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-change-me-in-env-file}"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Anti-detect Firefox. install.sh --with-camofox auto-clones redf0x1/camofox-browser
  # (MIT — REST API on :9377 wrapping the Camoufox engine).
  camofox:
    profiles: ["camofox"]
    build:
      context: ./camofox/src
    image: coire-camofox:latest
    container_name: coire-camofox
    ports:
      - "0.0.0.0:9378:9377"   # host :9378 → container :9377 (REST API)
      - "127.0.0.1:6080:6080" # noVNC viewer (loopback only)
    environment:
      CAMOFOX_HOST: 0.0.0.0
      CAMOFOX_API_KEY: ${CAMOFOX_API_KEY:-}
      CAMOFOX_AUTH_MODE: ${CAMOFOX_AUTH_MODE:-auto}
    volumes:
      - ./camofox/data:/home/node/.camofox
    restart: unless-stopped
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9377/health >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Pool / latency monitor. Reads bifrost logs + routing rules (read-only).
  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./dashboard
    image: coire-dashboard:latest
    container_name: coire-dashboard
    ports:
      - "0.0.0.0:9118:9118"
    volumes:
      - ~/.coire:/root/.coire:ro
      - /var/spool/cron/crontabs/${USER:-jkr}:/host_crontab:ro
      # NOTE: dashboard still needs a Phase-2 rework (it referenced removed
      # pool_weights.yaml / curator state). It's opt-in (profile) + deferred.
    environment:
      BIFROST_URL: http://172.17.0.1:4001
      BIFROST_USER: admin
      BIFROST_PASS: ${BIFROST_PASS}
    restart: unless-stopped
    depends_on:
      bifrost:
        condition: service_healthy
