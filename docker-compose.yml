# Hermes Free Cloud — 5 services
# bifrost     :4001  — AI gateway, free-tier multi-provider routing
# strip-shim  :4002  — strips reasoning + rewrites tool_call_ids (Mistral compat)
# searxng     :8891  — self-hosted meta-search (free web)
# camofox     :9378  — anti-detect Firefox browser (Camoufox + REST wrapper)
# dashboard   :9118  — pool monitor + circuit breaker UI (profile: dashboard)
#
# Hermes itself runs on the host (not here). It connects to:
#   strip-shim @ http://localhost:4002/v1
#   searxng    @ http://localhost:8891
#   camofox    @ http://localhost:9378
#   dashboard  @ http://localhost:9118  (start with: docker compose --profile dashboard up -d)
#
# Companion: circuit-breaker.service (systemd user) — see systemd/circuit-breaker.service

services:
  bifrost:
    image: maximhq/bifrost
    container_name: coire-bifrost
    ports:
      - "0.0.0.0:4001:8080"  # LAN-accessible (admin auth required)
    volumes:
      - ./bifrost/data:/app/data
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/providers > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  strip-shim:
    build:
      context: ./strip-shim
    image: coire-strip-shim:latest
    container_name: coire-strip-shim
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      BIFROST_URL: http://bifrost:8080
    depends_on:
      bifrost:
        condition: service_started
    restart: unless-stopped

  # Optional — opt in via: docker compose --profile searxng up -d
  # or install.sh --with-searxng
  searxng:
    profiles: ["searxng"]
    image: searxng/searxng:latest
    container_name: coire-searxng
    ports:
      - "127.0.0.1:8891:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:8891/"
      SEARXNG_SECRET: "${SEARXNG_SECRET:-change-me-in-env-file}"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional — opt in via: docker compose --profile camofox up -d
  # or install.sh --with-camofox. Requires ./camofox/src/ cloned first
  # (camofox-browser repo, set up by adapters/camofox/install.sh).
  camofox:
    profiles: ["camofox"]
    build:
      context: ./camofox/src
      dockerfile: Dockerfile.ci
    image: coire-camofox:latest
    container_name: coire-camofox
    ports:
      - "127.0.0.1:9378:9377"
    restart: unless-stopped
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9377/',r=>process.exit(r.statusCode==200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Pool monitor + circuit breaker UI. Optional — start with --profile dashboard.
  # Reads live data from bifrost (logs, routing rules, providers) and from the
  # circuit_breaker daemon's cooldown_status.json (mounted via ~/.coire).
  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./dashboard
    image: coire-dashboard:latest
    container_name: coire-dashboard
    ports:
      - "0.0.0.0:9118:9118"
    volumes:
      - ~/.coire:/root/.coire:ro
      # Curator-pool subdir is rw so dashboard action endpoints
      # (force-restore / prune) can update circuit_state.json. The
      # parent /root/.coire stays ro for everything else.
      - ~/.coire/curator-pool:/root/.coire/curator-pool:rw
      - /var/spool/cron/crontabs/${USER:-jkr}:/host_crontab:ro
      - ./bifrost/excluded_models.json:/app/bifrost/excluded_models.json:ro
      - ./bifrost/candidate_providers.json:/app/bifrost/candidate_providers.json:ro
      - ./scripts/runtime/pool_weights.yaml:/app/scripts/runtime/pool_weights.yaml:ro
    environment:
      BIFROST_URL: http://172.17.0.1:4001
      BIFROST_USER: admin
      BIFROST_PASS: ${BIFROST_PASS}
    restart: unless-stopped
    depends_on:
      bifrost:
        condition: service_healthy
